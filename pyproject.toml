[project]
name = "issue-1"
version = "0.1.0"
description = "MCP + Skills 销售分析 Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.5",
    "dashscope>=1.25.15",
    "fastmcp>=3.2.0",
    "mcp>=1.27.0",
    "ollama>=0.6.1",
    "openai>=2.30.0",
    "pick>=2.2.0",
    "prompt-toolkit>=3.0.48",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "zai-sdk>=0.2.2",
    "keyring>=25.0.0",      # API 密钥安全存储
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
]
