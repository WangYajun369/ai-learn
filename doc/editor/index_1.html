<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑 & 预览 & 复制到微信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部工具栏 ===== */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .toolbar .logo {
            font-weight: 700;
            font-size: 16px;
            color: #667eea;
            margin-right: 4px;
            white-space: nowrap;
        }
        .toolbar .file-info {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        .toolbar .spacer { flex: 1; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-primary:hover { background: #5a6fd6; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary.copied { background: #52c41a; }
        .btn-secondary { background: #f5f5f5; color: #555; border: 1px solid #d9d9d9; }
        .btn-secondary:hover { background: #e8e8e8; }
        .btn-success { background: #52c41a; color: #fff; }
        .btn-success:hover { background: #45a818; transform: translateY(-1px); }
        .btn-success:active { transform: translateY(0); }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-danger:hover { background: #e04345; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: #e0e0e0;
        }

        /* ===== 主布局：左 + 中 + 右 ===== */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 左侧文件列表 ===== */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: #fff;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 14px 16px 10px;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-header .count {
            font-size: 11px;
            font-weight: 400;
            color: #aaa;
            background: #f5f5f5;
            padding: 1px 8px;
            border-radius: 10px;
        }
        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .file-item {
            padding: 9px 16px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-item:hover {
            background: #f7f8fc;
            color: #667eea;
        }
        .file-item.active {
            background: #eef0ff;
            color: #667eea;
            border-left-color: #667eea;
            font-weight: 500;
        }
        .file-item .file-icon {
            flex-shrink: 0;
            font-size: 14px;
            opacity: 0.6;
        }
        .file-item .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-empty {
            padding: 30px 20px;
            text-align: center;
            color: #ccc;
            font-size: 13px;
            line-height: 1.8;
        }

        /* ===== 中间编辑器 ===== */
        .editor-panel {
            width: 50%;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e8e8e8;
            background: #fff;
            flex-shrink: 0;
        }
        .editor-header {
            padding: 10px 16px;
            background: #fafafa;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
            font-weight: 600;
            flex-shrink: 0;
        }
        .editor-header .editor-label {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .editor-header .modified-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4d4f;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .editor-header .modified-dot.show {
            opacity: 1;
        }
        .editor-header .spacer { flex: 1; }

        .editor-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .editor-tabs {
            width: 36px;
            background: #f5f5f5;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            padding: 8px 0;
            gap: 2px;
            flex-shrink: 0;
        }
        .editor-tab {
            width: 28px;
            height: 28px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 15px;
            color: #999;
            transition: all 0.15s;
        }
        .editor-tab:hover {
            background: #e8e8e8;
            color: #555;
        }
        .editor-tab.active {
            background: #fff;
            color: #667eea;
        }
        .editor-tab[title]::after { content: attr(title); font-size: 9px; }

        #editorTextarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            background: #fff;
            tab-size: 2;
            white-space: pre;
            overflow: auto;
        }
        #editorTextarea::selection {
            background: #b3d7ff;
        }

        /* ===== 右侧预览 ===== */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .preview-header {
            padding: 10px 16px;
            background: #fafafa;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
            font-weight: 600;
            flex-shrink: 0;
        }
        .preview-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            background: #f0f2f5;
        }
        .preview-container {
            max-width: 780px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow: hidden;
            min-height: 200px;
        }
        .preview-loading {
            padding: 60px;
            text-align: center;
            color: #bbb;
            font-size: 14px;
        }
        .preview-error {
            padding: 60px;
            text-align: center;
        }

        /* ===== 拖拽分割线 ===== */
        .resizer {
            width: 4px;
            cursor: col-resize;
            background: #e8e8e8;
            transition: background 0.15s;
            flex-shrink: 0;
            position: relative;
        }
        .resizer:hover, .resizer.active {
            background: #667eea;
        }
        .resizer::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: -4px; right: -4px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #52c41a;
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(82,196,26,0.3);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.toast-warn {
            background: #faad14;
        }
        .toast.toast-error {
            background: #ff4d4f;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .sidebar { width: 180px; min-width: 180px; }
            .editor-panel { width: 40%; min-width: 200px; }
            .file-item { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast">✅ 已复制，可直接粘贴到微信公众号后台</div>

<div class="toolbar">
    <span class="logo">📝 微信排版工具</span>
    <span class="file-info" id="fileInfo">-</span>
    <div class="spacer"></div>
    <button class="btn btn-secondary btn-sm" id="btnReset" title="放弃编辑，恢复为文件原始内容">
        ↩ 恢复原始
    </button>
    <button class="btn btn-success btn-sm" id="btnSave" title="保存编辑内容到文件">
        💾 保存文件
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn btn-secondary btn-sm" id="btnSelectAll" title="全选文章内容">
        📋 全选
    </button>
    <button class="btn btn-primary" id="btnCopy" title="复制后可直接粘贴到微信公众号后台">
        📌 一键复制到微信
    </button>
</div>

<div class="main-layout">
    <!-- 左侧文件列表 -->
    <div class="sidebar">
        <div class="sidebar-header">
            📂 文件列表 <span class="count" id="fileCount">0</span>
        </div>
        <div class="file-list" id="fileList">
            <div class="sidebar-empty">加载中...</div>
        </div>
    </div>

    <!-- 中间编辑器 -->
    <div class="editor-panel" id="editorPanel">
        <div class="editor-header">
            <span class="editor-label">✏️ 编辑器</span>
            <span class="modified-dot" id="modifiedDot" title="内容已修改，未保存"></span>
            <div class="spacer"></div>
            <span style="font-size:11px;color:#bbb;font-weight:400;" id="editorHint">Ctrl+S 保存</span>
        </div>
        <div class="editor-body">
            <textarea id="editorTextarea" spellcheck="false" placeholder="选择左侧文件后，HTML 源码会显示在这里..."></textarea>
        </div>
    </div>

    <!-- 拖拽分割线 -->
    <div class="resizer" id="resizer"></div>

    <!-- 右侧预览 -->
    <div class="preview-panel">
        <div class="preview-header">
            👁️ 实时预览
        </div>
        <div class="preview-area">
            <div class="preview-container" id="preview">
                <div class="preview-loading">选择左侧文件以加载预览...</div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ========== 配置 ==========
    var WECHAT_DIR = 'wechat';
    var DEFAULT_FILE = WECHAT_DIR + '/article_wechat.html';

    // ========== DOM ==========
    var previewEl = document.getElementById('preview');
    var fileListEl = document.getElementById('fileList');
    var fileInfoEl = document.getElementById('fileInfo');
    var fileCountEl = document.getElementById('fileCount');
    var editorEl = document.getElementById('editorTextarea');
    var modifiedDotEl = document.getElementById('modifiedDot');
    var editorPanel = document.getElementById('editorPanel');

    var currentFile = null;
    var originalHtml = '';   // 文件原始内容（用于"恢复原始"和判断是否修改）
    var isModified = false;
    var previewTimer = null;

    // ========== 文件列表 ==========
    function loadFileList() {
        fetch(WECHAT_DIR + '/index.json')
            .then(function(res) { return res.ok ? res.json() : Promise.reject(); })
            .then(function(files) { renderFileList(files); })
            .catch(function() {
                var params = new URLSearchParams(window.location.search);
                var paramFile = params.get('file');
                var files = [DEFAULT_FILE];
                if (paramFile) {
                    var normalized = normalizeFile(paramFile);
                    if (normalized !== files[0]) files.unshift(normalized);
                }
                renderFileList(files);
            });
    }

    function normalizeFile(file) {
        if (file && !file.includes('/') && !file.startsWith('http')) {
            return WECHAT_DIR + '/' + file;
        }
        return file;
    }

    function renderFileList(files) {
        fileListEl.innerHTML = '';
        fileCountEl.textContent = files.length;

        if (files.length === 0) {
            fileListEl.innerHTML = '<div class="sidebar-empty">暂无文章<br>请将 *_wechat.html 放入<br>wechat/ 目录</div>';
            return;
        }

        files.forEach(function(file) {
            var fullPath = normalizeFile(file);
            var displayName = file.split('/').pop();
            var item = document.createElement('div');
            item.className = 'file-item';
            item.setAttribute('data-file', fullPath);
            item.innerHTML = '<span class="file-icon">📄</span><span class="file-name">' + escapeHtml(displayName) + '</span>';
            item.addEventListener('click', function() {
                loadArticle(fullPath);
                fileListEl.querySelectorAll('.file-item').forEach(function(el) { el.classList.remove('active'); });
                item.classList.add('active');
            });
            fileListEl.appendChild(item);
        });

        // 默认加载第一个文件
        var params = new URLSearchParams(window.location.search);
        var paramFile = params.get('file');
        var startFile = paramFile ? normalizeFile(paramFile) : normalizeFile(files[0]);
        loadArticle(startFile);
        fileListEl.querySelectorAll('.file-item').forEach(function(el) {
            if (el.getAttribute('data-file') === startFile) el.classList.add('active');
        });
    }

    // ========== 加载文章 ==========
    function loadArticle(fileUrl) {
        // 如果有未保存的修改，提示用户
        if (isModified) {
            if (!confirm('当前文件有未保存的修改，切换文件会丢失更改。是否继续？')) return;
        }

        currentFile = fileUrl;
        fileInfoEl.textContent = fileUrl;
        previewEl.innerHTML = '<div class="preview-loading">加载中...</div>';
        editorEl.value = '';
        setModified(false);

        fetch(fileUrl)
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function(html) {
                originalHtml = html;
                editorEl.value = html;
                setModified(false);
                updatePreview(html);
            })
            .catch(function(err) {
                previewEl.innerHTML =
                    '<div class="preview-error">' +
                    '<p style="font-size:18px;margin-bottom:12px;color:#e53935;">⚠️ 加载失败</p>' +
                    '<p style="color:#888;">' + escapeHtml(err.message) + '</p>' +
                    '<p style="color:#aaa;font-size:13px;margin-top:12px;">请确认文件路径正确，或通过 ?file= 参数指定</p>' +
                    '</div>';
            });
    }

    // ========== 编辑器 → 预览（实时） ==========
    function updatePreview(html) {
        previewEl.innerHTML = html;
        applyBodyStyles();
    }

    function applyBodyStyles() {
        var styles = previewEl.querySelectorAll('style');
        styles.forEach(function(styleEl) {
            var css = styleEl.textContent;
            css = css.replace(/\bbody\b/g, '.preview-container');
            styleEl.textContent = css;
        });
    }

    // 编辑器输入 → 防抖更新预览
    editorEl.addEventListener('input', function() {
        var current = editorEl.value;
        setModified(current !== originalHtml);

        clearTimeout(previewTimer);
        previewTimer = setTimeout(function() {
            updatePreview(current);
        }, 500);
    });

    // Tab 键支持
    editorEl.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            var start = this.selectionStart;
            var end = this.selectionEnd;
            this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 2;
            this.dispatchEvent(new Event('input'));
        }
        // Ctrl+S / Cmd+S 保存
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            saveFile();
        }
    });

    // ========== 修改状态 ==========
    function setModified(modified) {
        isModified = modified;
        modifiedDotEl.classList.toggle('show', modified);
    }

    // ========== 保存文件 ==========
    function saveFile() {
        if (!currentFile) return;

        var content = editorEl.value;
        var formData = new FormData();
        formData.append('content', content);
        formData.append('file', currentFile);

        // 通过 fetch POST 保存（需要配合简单的保存服务，或使用 Blob 下载）
        // 这里使用 Blob 下载作为通用方案
        var blob = new Blob([content], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = currentFile.split('/').pop();
        a.click();
        URL.revokeObjectURL(url);

        showToastMsg('📥 文件已下载：' + currentFile.split('/').pop(), 'toast-warn');
    }

    // ========== 恢复原始 ==========
    function resetEditor() {
        if (!originalHtml) return;
        if (!confirm('确定恢复为文件原始内容？当前编辑会丢失。')) return;
        editorEl.value = originalHtml;
        setModified(false);
        updatePreview(originalHtml);
        showToastMsg('↩ 已恢复为原始内容');
    }

    // ========== 复制到微信 ==========
    function copyWechatHtml() {
        var htmlContent = editorEl.value || previewEl.innerHTML;
        if (!htmlContent.trim()) return;

        if (navigator.clipboard && navigator.clipboard.write) {
            var blob = new Blob([htmlContent], { type: 'text/html' });
            var item = new ClipboardItem({ 'text/html': blob });
            navigator.clipboard.write([item]).then(function() {
                showToastMsg('✅ 已复制，可直接粘贴到微信公众号后台');
                animateCopyButton();
            }).catch(function() {
                fallbackCopy(htmlContent);
            });
        } else {
            fallbackCopy(htmlContent);
        }
    }

    function fallbackCopy(htmlContent) {
        var tempDiv = document.createElement('div');
        tempDiv.setAttribute('contenteditable', 'true');
        tempDiv.style.cssText = 'position:fixed;left:-9999px;top:0;background:transparent;color:inherit;';
        tempDiv.innerHTML = htmlContent;
        document.body.appendChild(tempDiv);

        var range = document.createRange();
        range.selectNodeContents(tempDiv);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        var success = false;
        try { success = document.execCommand('copy'); } catch(e) {}
        selection.removeAllRanges();
        document.body.removeChild(tempDiv);

        if (success) {
            showToastMsg('✅ 已复制，可直接粘贴到微信公众号后台');
            animateCopyButton();
        } else {
            alert('复制失败，请手动全选后 Ctrl+C / Cmd+C');
        }
    }

    function selectAllContent() {
        var range = document.createRange();
        range.selectNodeContents(previewEl);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }

    // ========== 拖拽分割线 ==========
    (function initResizer() {
        var resizer = document.getElementById('resizer');
        var startX, startWidth;

        resizer.addEventListener('mousedown', function(e) {
            startX = e.clientX;
            startWidth = editorPanel.offsetWidth;
            resizer.classList.add('active');
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });

        function onMove(e) {
            var dx = e.clientX - startX;
            var newWidth = Math.max(250, Math.min(startWidth + dx, window.innerWidth - 400));
            editorPanel.style.width = newWidth + 'px';
        }

        function onUp() {
            resizer.classList.remove('active');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
    })();

    // ========== UI 反馈 ==========
    var toastTimer = null;
    function showToastMsg(msg, className) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast' + (className ? ' ' + className : '');
        // 触发 reflow
        void toast.offsetWidth;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    function animateCopyButton() {
        var btn = document.getElementById('btnCopy');
        var orig = btn.innerHTML;
        btn.innerHTML = '✅ 已复制';
        btn.classList.add('copied');
        setTimeout(function() { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
    }

    function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // ========== 初始化 ==========
    document.getElementById('btnCopy').addEventListener('click', copyWechatHtml);
    document.getElementById('btnSelectAll').addEventListener('click', selectAllContent);
    document.getElementById('btnSave').addEventListener('click', saveFile);
    document.getElementById('btnReset').addEventListener('click', resetEditor);

    loadFileList();

})();
</script>

</body>
</html>
